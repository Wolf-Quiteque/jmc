backend:
  name: github
  repo: Wolf-Quiteque/jmc
  branch: main

media_folder: "img"
public_folder: "/img"

collections:
  - name: "pages"
    label: "Pages"
    files:
      - file: "index.html"
        label: "Home Page"
        name: "index"
        fields:
          - {label: "Title", name: "title", widget: "hidden", default: "Home"}
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - {label: "Video URL", name: "video_url", widget: "string"}
          - label: "Process"
            name: "process"
            widget: "list"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}
          - label: "About"
            name: "about"
            widget: "object"
            fields:
              - {label: "Subtitle", name: "subtitle", widget: "string"}
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Content", name: "content", widget: "markdown"}
              - {label: "Image", name: "image", widget: "image"}
              - {label: "Video URL", name: "video_url", widget: "string"}
          - label: "Filda"
            name: "filda"
            widget: "object"
            fields:
              - {label: "Subtitle", name: "subtitle", widget: "string"}
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}
              - label: "Gallery"
                name: "gallery"
                widget: "list"
                field: {label: "Image", name: "image", widget: "image"}
          - label: "Car Fleet"
            name: "car_fleet"
            widget: "object"
            fields:
              - {label: "Subtitle", name: "subtitle", widget: "string"}
              - {label: "Title", name: "title", widget: "string"}
              - label: "Cars"
                name: "cars"
                widget: "list"
                fields:
                  - {label: "Image", name: "image", widget: "image"}
                  - {label: "Name", name: "name", widget: "string"}
                  - {label: "Link", name: "link", widget: "string"}
                  - label: "Details"
                    name: "details"
                    widget: "list"
                    field: {label: "Detail", name: "detail", widget: "string"}
          - label: "Booking"
            name: "booking"
            widget: "object"
            fields:
              - {label: "Subtitle", name: "subtitle", widget: "string"}
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}
          - label: "Truck Fleet"
            name: "truck_fleet"
            widget: "object"
            fields:
              - {label: "Subtitle", name: "subtitle", widget: "string"}
              - {label: "Title", name: "title", widget: "string"}
              - label: "Trucks"
                name: "trucks"
                widget: "list"
                fields:
                  - {label: "Image", name: "image", widget: "image"}
                  - {label: "Name", name: "name", widget: "string"}
                  - {label: "Link", name: "link", widget: "string"}
                  - label: "Details"
                    name: "details"
                    widget: "list"
                    field: {label: "Detail", name: "detail", widget: "string"}
          - label: "Purchase Process"
            name: "purchase_process"
            widget: "object"
            fields:
              - {label: "Subtitle", name: "subtitle", widget: "string"}
              - {label: "Title", name: "title", widget: "string"}
              - label: "Steps"
                name: "steps"
                widget: "list"
                fields:
                  - {label: "Title", name: "title", widget: "string"}
                  - {label: "Description", name: "description", widget: "text"}
          - label: "Video Section"
            name: "video_section"
            widget: "object"
            fields:
              - {label: "Subtitle", name: "subtitle", widget: "string"}
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Video URL", name: "video_url", widget: "string"}
          - label: "Testimonials"
            name: "testimonials"
            widget: "object"
            fields:
              - {label: "Subtitle", name: "subtitle", widget: "string"}
              - {label: "Title", name: "title", widget: "string"}
              - label: "Items"
                name: "items"
                widget: "list"
                fields:
                  - {label: "Quote", name: "quote", widget: "text"}
                  - {label: "Author", name: "author", widget: "string"}
                  - {label: "Role", name: "role", widget: "string"}
                  - {label: "Image", name: "image", widget: "image"}
          - label: "Blog"
            name: "blog"
            widget: "object"
            fields:
              - {label: "Subtitle", name: "subtitle", widget: "string"}
              - {label: "Title", name: "title", widget: "string"}
              - label: "Posts"
                name: "posts"
                widget: "list"
                fields:
                  - {label: "Image", name: "image", widget: "image"}
                  - {label: "Category", name: "category", widget: "string"}
                  - {label: "Title", name: "title", widget: "string"}
                  - {label: "Link", name: "link", widget: "string"}
                  - {label: "Date", name: "date", widget: "datetime"}
          - label: "Lets Talk"
            name: "lets_talk"
            widget: "object"
            fields:
              - {label: "Subtitle", name: "subtitle", widget: "string"}
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}
